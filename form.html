<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body>

<form>
    <table>

        <tr>
            <td><b>FULL NAME</b></td>
            <td><input type="text" placeholder="Enter Your Name"></td>
        </tr>

        <tr>
            <td><b>EMAIL ID</b></td>
            <td><input type="text" placeholder="Enter Your Email"></td>
        </tr>

        <tr>
            <td><b>AGE</b></td>
            <td><input type="number" placeholder="Enter Your Age"></td>
        </tr>

        <tr>
            <td>Which option best describes your current role?</td>
            <td>
                <select>
                    <option>Student</option>
                    <option>Employed</option>
                    <option>Unemployed</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Would you like to list reference?</td>
            <td>
                <select>
                    <option>YES</option>
                    <option>NO</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Which position do you like to apply for?</td>
            <td>
                <select>
                    <option>ABC</option>
                    <option>DEF</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>What programming languages do you know?</td>
            <td>
                <input type="checkbox"> Java <br>
                <input type="checkbox"> Python <br>
                <input type="checkbox"> C++ <br>
                <input type="checkbox"> C <br>
            </td>
        </tr>

        <tr>
            <td>Any comments?</td>
            <td>
                <textarea name="comments" rows="4" cols="25" placeholder="Enter Your Comments"></textarea>
            </td>
        </tr>

        <tr>
            <td></td>
            <td>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
        </tr>

    </table>
</form>

</body>
</html>
