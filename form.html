<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>

<div class="container">

<!-- Updated onsubmit -->
<form onsubmit="savePDF(event)" onreset="return confirmReset()">

    <div>
        <label><b>FULL NAME</b></label><br>
        <input type="text" placeholder="Enter Your Name" required>
    </div>
    <br>

    <div>
        <label><b>EMAIL ID</b></label><br>
        <input type="email" placeholder="Enter Your Email" id="email" required>
    </div>
    <br>

    <div>
        <label><b>AGE</b></label><br>
        <input type="number" placeholder="Enter Your Age" id="ageInput" required>
    </div>
    <br>

    <div>
        <label><b>Option best describes your current role?</b></label><br>
        <select>
            <option>Student</option>
            <option>Employed</option>
            <option>Unemployed</option>
        </select>
    </div>
    <br>

    <div>
        <label><b>Would you like to list references?</b></label><br>
        <select>
            <option>YES</option>
            <option>NO</option>
        </select>
    </div>
    <br>

    <div>
        <label><b>Position would you like to apply for?</b></label><br>
        <select>
            <option>ABC</option>
            <option>DEF</option>
        </select>
    </div>
    <br>

    <div>
        <label><b>Programming Languages You Know</b></label><br>
        <input type="checkbox"> Java <br>
        <input type="checkbox"> Python <br>
        <input type="checkbox"> C++ <br>
        <input type="checkbox"> C
    </div>
    <br>

    <div>
        <label><b>Comments</b></label><br>
        <textarea rows="4" cols="25" placeholder="Enter Your Comments"></textarea>
    </div>
    <br>

    <div class="button">
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </div>

</form>

</div>

<script src="script.js"></script>

</body>
</html>
